services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trucksafe-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trucksafe-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
